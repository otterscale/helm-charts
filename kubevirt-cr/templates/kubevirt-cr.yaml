---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    imagePullPolicy: IfNotPresent
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  {{- with .Values.kubevirt.imageRegistry }}
  imageRegistry: {{ . }}
  {{- end }}
  {{- with .Values.kubevirt.imageTag }}
  imageTag: {{ . }}
  {{- end }}
