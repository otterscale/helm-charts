image:
  repository: ghcr.io/otterscale/otterscale
  tag: v1.5.0-rc.5
  pullPolicy: IfNotPresent

agent:
  # The upstream API. Keep the /api/ prefix — that is the route the Gateway
  # rewrites onto the server.
  serverURL: "https://otterscale.example.com/api/"
  # SHARED: must equal the upstream's tunnel.externalURL. Dialled directly, not
  # through the Gateway.
  tunnelServerURL: "https://192.0.2.1:30300"
  # SHARED: the name the join token is bound to. A token issued for another
  # name is rejected.
  cluster: "devel"
  # Issued by `otterscale join token --cluster <name>` on the server. Either an
  # inline token or a Secret you created here; both are mounted as a file, so
  # neither reaches the agent's environment. Inline lands in the Helm release.
  joinToken: ""
  existingSecret: ""
  existingSecretKey: "join-token"

# The CA behind agent.serverURL's certificate, from `otterscale join ca`.
# Without it a privately signed certificate fails registration with x509.
# Empty is right for a public CA. Create the Secret here; the chart does not.
# INTERNAL WIRING: tenant-operator mounts this same Secret by name (optional),
# so it must stay "otterscale-ca" while that operator is enabled.
trustedCA:
  secretName: ""
  key: "ca.crt"

# Binds cluster-admin to the listed users on THIS cluster. Empty = no binding.
clusterAdmin:
  enabled: true
  users: []

# Read-only access granted to system:authenticated, so the dashboard can show
# nodes and storage classes to any logged-in user.
rbac:
  nodeReader:
    enabled: true

  storageClassReader:
    enabled: true

# How users reach workloads on THIS cluster. The API cannot answer that, so the
# answer is written into the otterscale-info ConfigMap in kube-public, which the
# dashboard reads as any logged-in user.
clusterInfo:
  enabled: true
  externalAddress: "192.0.2.1"
  nodePortRange: "30000-32767"
  inferenceURL: "https://inference.example.com"

# files/tenant-operator/install.yaml is a rendered manifest pinned to
# otterscale-system, so this chart only installs into that namespace while the
# operator is enabled.
tenantOperator:
  enabled: true
  rancherProjectID: "" # empty = no Rancher project annotation

  # Each entry rewrites `from` (the image reference hardcoded in
  # files/tenant-operator/install.yaml) to repository:tag[@digest].
  # Rendering fails if `from` no longer appears in that file.
  images:
    tenantOperator:
      from: ghcr.io/otterscale/tenant-operator:v1.5.0-ea.1
      repository: ghcr.io/otterscale/tenant-operator
      # renovate: image=ghcr.io/otterscale/tenant-operator
      tag: v1.5.0-ea.1

  # SHARED: the upstream Harbor (its harbor.externalURL) and a robot account you
  # created there. The operator uses them to give each workspace its own project,
  # robot and imagePullSecret. All three are required when enabled — the
  # operator refuses to run half-configured.
  harbor:
    url: https://harbor.example.com
    robot:
      name: "robot$devel"
      secret: ""
