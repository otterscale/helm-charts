image:
  repository: ghcr.io/otterscale/otterscale
  tag: ""
  pullPolicy: IfNotPresent

agent:
  # The upstream API. Keep the /api/ prefix — that is the route the Gateway
  # rewrites onto the server.
  serverURL: "https://otterscale.example.com/api/"
  # SHARED: must equal the upstream's tunnel.externalURL. Dialled directly, not
  # through the Gateway.
  tunnelServerURL: "https://192.0.2.1:30300"
  # SHARED: the name the join token is bound to. A token issued for another
  # name is rejected.
  cluster: "devel"
  # Issued by `otterscale join token --cluster <name>` on the server. Either an
  # inline token or a Secret you created here; both are mounted as a file, so
  # neither reaches the agent's environment. Inline lands in the Helm release.
  joinToken: ""
  existingSecret: ""
  existingSecretKey: "join-token"

# The CA behind agent.serverURL's certificate, from `otterscale join ca`.
# Without it a privately signed certificate fails registration with x509.
# Empty is right for a public CA. Create the Secret here; the chart does not.
trustedCA:
  secretName: ""
  key: "ca.crt"

# Binds cluster-admin to the listed users on THIS cluster. Empty = no binding.
clusterAdmin:
  enabled: true
  users: []

# Read-only access granted to system:authenticated, so the dashboard can show
# nodes and storage classes to any logged-in user.
rbac:
  nodeReader:
    enabled: true

  storageClassReader:
    enabled: true

# files/tenant-operator/install.yaml is a rendered manifest pinned to
# otterscale-system, so this chart only installs into that namespace while the
# operator is enabled.
tenantOperator:
  enabled: true
  rancherProjectID: "" # empty = no Rancher project annotation

  # A Harbor robot account the operator uses to create per-workspace projects.
  harbor:
    url: https://harbor.example.com
    robot:
      name: "robot$devel"
      secret: ""

licenseOperator:
  enabled: false

flux2:
  enabled: true
  installCRDs: true

  multitenancy:
    enabled: true
    defaultServiceAccount: "default"
    privileged: false

  helmController:
    create: true

  imageAutomationController:
    create: false

  imageReflectionController:
    create: false

  kustomizeController:
    create: false

  notificationController:
    create: false

  sourceController:
    create: true

  sourceWatcher:
    create: false

  policies:
    create: true

  rbac:
    create: true
    createAggregation: true
    roleRef:
      name: crd-controller

  watchAllNamespaces: true

  # The policy below pins every HelmRelease to a fixed service account, so a
  # workspace cannot deploy with more privilege than its own.
  extraObjects:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-deployer
        namespace: otterscale-system
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: otterscale-platform-deployer
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: platform-deployer
          namespace: otterscale-system
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: otterscale-helmrelease-identity
      spec:
        failurePolicy: Fail
        matchConstraints:
          resourceRules:
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              apiVersions: ["*"]
              operations: ["CREATE", "UPDATE"]
              resources: ["helmreleases"]
        variables:
          - name: serviceAccountName
            expression: "has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : ''"
          - name: isPlatformNamespace
            expression: "request.namespace == 'otterscale-system'"
        validations:
          - expression: "variables.serviceAccountName != ''"
            message: "spec.serviceAccountName is required"
          - expression: "!has(object.spec.kubeConfig)"
            message: "spec.kubeConfig is not allowed"
          - expression: >-
              variables.isPlatformNamespace ?
              variables.serviceAccountName == 'platform-deployer' :
              variables.serviceAccountName == 'workspace-deployer'
            message: "spec.serviceAccountName must be 'platform-deployer' in otterscale-system and 'workspace-deployer' elsewhere"
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: otterscale-helmrelease-identity
      spec:
        policyName: otterscale-helmrelease-identity
        validationActions: ["Deny"]
        matchResources: {}

topolvm:
  enabled: false
