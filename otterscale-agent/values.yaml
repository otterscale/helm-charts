image:
  repository: ghcr.io/otterscale/otterscale
  tag: ""
  pullPolicy: IfNotPresent

agent:
  serverURL: "https://otterscale.example.com/api/"
  tunnelServerURL: "https://10.0.0.1:30300"
  cluster: "devel"
  enrolmentToken: ""

clusterAdmin:
  enabled: true
  users: []

rbac:
  nodeReader:
    enabled: true

  storageClassReader:
    enabled: true

tenantOperator:
  enabled: true
  rancherProjectID: ""

  harbor:
    url: https://harbor.example.com
    robot:
      name: "robot$devel"
      secret: ""

licenseOperator:
  enabled: false

flux2:
  enabled: true
  installCRDs: true

  multitenancy:
    enabled: true
    defaultServiceAccount: "default"
    privileged: false

  helmController:
    create: true

  imageAutomationController:
    create: false

  imageReflectionController:
    create: false

  kustomizeController:
    create: false

  notificationController:
    create: false

  sourceController:
    create: true

  sourceWatcher:
    create: false

  policies:
    create: true

  rbac:
    create: true
    createAggregation: true
    roleRef:
      name: crd-controller

  watchAllNamespaces: true

  extraObjects:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-deployer
        namespace: otterscale-system
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: otterscale-platform-deployer
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: platform-deployer
          namespace: otterscale-system
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: otterscale-helmrelease-identity
      spec:
        failurePolicy: Fail
        matchConstraints:
          resourceRules:
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              apiVersions: ["*"]
              operations: ["CREATE", "UPDATE"]
              resources: ["helmreleases"]
        variables:
          - name: serviceAccountName
            expression: "has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : ''"
          - name: isPlatformNamespace
            expression: "request.namespace == 'otterscale-system'"
        validations:
          - expression: "variables.serviceAccountName != ''"
            message: "spec.serviceAccountName is required"
          - expression: "!has(object.spec.kubeConfig)"
            message: "spec.kubeConfig is not allowed"
          - expression: >-
              variables.isPlatformNamespace ?
              variables.serviceAccountName == 'platform-deployer' :
              variables.serviceAccountName == 'workspace-deployer'
            message: "spec.serviceAccountName must be 'platform-deployer' in otterscale-system and 'workspace-deployer' elsewhere"
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: otterscale-helmrelease-identity
      spec:
        policyName: otterscale-helmrelease-identity
        validationActions: ["Deny"]
        matchResources: {}

topolvm:
  enabled: false
