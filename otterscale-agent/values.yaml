image:
  repository: ghcr.io/otterscale/otterscale
  tag: ""
  pullPolicy: IfNotPresent

agent:
  serverURL: "https://otterscale.example.com/api/"
  tunnelServerURL: " https://10.0.0.1:30300"
  cluster: "devel"

harbor:
  url: https://harbor.example.com
  robot:
    name: "robot$devel"
    secret: ""

clusterAdmin:
  enabled: true
  users: []

rbac:
  nodeReader:
    enabled: true
  storageClassReader:
    enabled: true

tenantOperator:
  enabled: true
  rancherProjectID: ""

certManager:
  enabled: true
