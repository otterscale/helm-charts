---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otterscale-info-reader
  namespace: kube-public
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["otterscale-info"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otterscale-info-reader
  namespace: kube-public
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: otterscale-info-reader
  apiGroup: rbac.authorization.k8s.io
