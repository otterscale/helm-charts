---
apiVersion: v1
kind: Secret
metadata:
  name: otterscale-agent-secret
  namespace: otterscale-system
type: Opaque
stringData:
  OTTERSCALE_AGENT_ENROLMENT_TOKEN: {{ required "agent.enrolmentToken is required. Issue one on the server with: kubectl -n otterscale-system exec deploy/otterscale-server -- /otterscale enrolment-token --cluster <name>" .Values.agent.enrolmentToken | quote }}
