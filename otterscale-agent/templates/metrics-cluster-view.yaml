# For operators who should see cluster-wide metrics in the OtterScale dashboard
# without being cluster-admin. The OtterScale server asks this cluster, as the
# signed-in user, whether they may get prometheuses/api on this Prometheus —
# the attribute kube-rbac-proxy checks for the agent. Bound to nobody here:
#   kubectl create clusterrolebinding metrics-view-<name> \
#     --clusterrole=otterscale:metrics-cluster-view --user=<OIDC subject>
# A fixed name, so the same command works on every cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otterscale:metrics-cluster-view
  labels:
    {{- include "otterscale-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses/api"]
    resourceNames: [{{ .Values.metrics.prometheusName | quote }}]
    verbs: ["get"]
