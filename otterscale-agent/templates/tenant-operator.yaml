{{- if .Values.tenantOperator.enabled }}
{{ .Files.Get "files/tenant-operator/install.yaml" }}
---
apiVersion: v1
kind: Secret
metadata:
  # INTERNAL WIRING: the name is read by files/tenant-operator/install.yaml and
  # by the operator itself, so it cannot carry the release name.
  name: tenant-operator-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  HARBOR_URL: {{ .Values.tenantOperator.harbor.url | quote }}
  HARBOR_ROBOT_NAME: {{ .Values.tenantOperator.harbor.robot.name | quote }}
  HARBOR_ROBOT_SECRET: {{ .Values.tenantOperator.harbor.robot.secret | quote }}
{{- if .Values.tenantOperator.rancherProjectID }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # INTERNAL WIRING: same, see OperatorConfigName in the operator's source.
  name: tenant-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale-agent.labels" . | nindent 4 }}
data:
  RancherProjectID: {{ .Values.tenantOperator.rancherProjectID | quote }}
{{- end }}
{{- end }}
