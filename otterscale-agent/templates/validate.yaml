{{- if and .Values.agent.joinToken .Values.agent.existingSecret }}
  {{- fail "set either agent.joinToken or agent.existingSecret, not both" }}
{{- end }}
{{- if not (or .Values.agent.joinToken .Values.agent.existingSecret) }}
  {{- fail "agent.joinToken or agent.existingSecret must be set. Issue a token on the server with: kubectl -n otterscale-system exec deploy/<release>-otterscale-server -- /otterscale join token --cluster <name>" }}
{{- end }}
{{- if and .Values.agent.existingSecret (not .Values.agent.existingSecretKey) }}
  {{- fail "agent.existingSecretKey must be set: it is the key inside agent.existingSecret holding the join token" }}
{{- end }}
{{- if not .Values.agent.serverURL }}
  {{- fail "agent.serverURL must be set: it is the otterscale API this agent registers against" }}
{{- end }}
{{- if not .Values.agent.tunnelServerURL }}
  {{- fail "agent.tunnelServerURL must be set: it is the tunnel listener this agent dials" }}
{{- end }}
{{- if not .Values.agent.cluster }}
  {{- fail "agent.cluster must be set: it is the name this cluster registers under" }}
{{- end }}
{{- if and .Values.trustedCA.secretName (not .Values.trustedCA.key) }}
  {{- fail "trustedCA.key must be set: it is the key inside the Secret holding the CA certificate" }}
{{- end }}
{{- if .Values.clusterInfo.enabled }}
  {{- $address := .Values.clusterInfo.externalAddress }}
  {{- if not $address }}
    {{- fail "clusterInfo.externalAddress must be set: it is the address users reach this cluster's NodePort services at. Set clusterInfo.enabled=false to leave the dashboard without it." }}
  {{- end }}
  {{- if contains "://" $address }}
    {{- fail (printf "clusterInfo.externalAddress must be a bare address, got %q: the scheme is the dashboard's to choose" $address) }}
  {{- end }}
  {{- if and (regexMatch ":[0-9]+$" $address) (eq (len (splitList ":" $address)) 2) }}
    {{- fail (printf "clusterInfo.externalAddress must not carry a port, got %q: the port comes from clusterInfo.nodePortRange" $address) }}
  {{- end }}
  {{- $range := .Values.clusterInfo.nodePortRange | toString }}
  {{- if not (regexMatch "^[0-9]+-[0-9]+$" $range) }}
    {{- fail (printf "clusterInfo.nodePortRange must look like \"30000-32767\", got %q" $range) }}
  {{- end }}
  {{- $bounds := splitList "-" $range }}
  {{- if ge (atoi (index $bounds 0)) (atoi (index $bounds 1)) }}
    {{- fail (printf "clusterInfo.nodePortRange is inverted: %q" $range) }}
  {{- end }}
  {{- with .Values.clusterInfo.inferenceURL }}
    {{- if not (or (hasPrefix "http://" .) (hasPrefix "https://" .)) }}
      {{- fail (printf "clusterInfo.inferenceURL must be an absolute http or https URL, got %q" .) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.tenantOperator.enabled }}
  {{- if not .Values.tenantOperator.harbor.url }}
    {{- fail "tenantOperator.harbor.url must be set: it is the upstream Harbor the operator provisions per-workspace projects in" }}
  {{- end }}
  {{- if not .Values.tenantOperator.harbor.robot.name }}
    {{- fail "tenantOperator.harbor.robot.name must be set: the operator authenticates to Harbor as this robot" }}
  {{- end }}
  {{- if not .Values.tenantOperator.harbor.robot.secret }}
    {{- fail "tenantOperator.harbor.robot.secret must be set: create the robot in the upstream Harbor first. Without it every Workspace stalls at Ready=False, because the operator refuses to run half-configured rather than leave workspaces without registry access." }}
  {{- end }}
{{- end }}
{{- if and .Values.tenantOperator.enabled (ne .Release.Namespace "otterscale-system") }}
  {{- fail (printf "release namespace must be otterscale-system, got %q: files/tenant-operator/install.yaml is a rendered manifest that pins that namespace, so the operator and this chart's own resources would land apart. Set tenantOperator.enabled=false to install elsewhere." .Release.Namespace) }}
{{- end }}
