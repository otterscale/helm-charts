apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otterscale-agent.fullname" . }}
  labels:
    {{- include "otterscale-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
# A ClusterRole: the Secret's namespace may not exist yet when the agent is
# installed. resourceNames limits it to that Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otterscale-agent.fullname" . }}-metrics
  labels:
    {{- include "otterscale-agent.labels" . | nindent 4 }}
rules:
  # kube-rbac-proxy maps a GET query to get and a POST one to create.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses/api"]
    resourceNames: [{{ .Values.metrics.prometheusName | quote }}]
    verbs: ["get", "create"]
  {{- if .Values.metrics.caSecret.name }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.metrics.caSecret.name | quote }}]
    verbs: ["get"]
  {{- end }}
