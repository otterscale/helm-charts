{{- if .Values.llmisvcConfigs.enabled }}
{{- $content := .Files.Get "files/llmisvcconfigs/resources.yaml" }}
{{- range $key, $image := .Values.llmisvcConfigs.images }}
{{- if not $image.from }}
{{- fail (printf "llmisvcConfigs.images.%s.from is required" $key) }}
{{- end }}
{{- $ref := printf "%s:%s" (required (printf "llmisvcConfigs.images.%s.repository is required" $key) $image.repository) (required (printf "llmisvcConfigs.images.%s.tag is required" $key) $image.tag) }}
{{- with $image.digest }}
{{- $ref = printf "%s@%s" $ref . }}
{{- end }}
{{- if not (contains $image.from $content) }}
{{- fail (printf "llmisvcConfigs.images.%s.from (%s) not found in files/llmisvcconfigs/resources.yaml" $key $image.from) }}
{{- end }}
{{- $content = $content | replace $image.from $ref }}
{{- end }}
{{- /* Mirrors kserve-common.replaceNamespace from the subchart. */}}
{{ $content | replace "namespace: kserve\n" (printf "namespace: %s\n" .Release.Namespace) }}
{{- end }}
