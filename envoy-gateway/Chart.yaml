apiVersion: v2
name: envoy-gateway
description: A Helm chart for envoy-gateway
type: application
version: 1.0.0
appVersion: "v1.8.4"
annotations:
  otterscale.io/type: module
  module.otterscale.io/namespace: "envoy-gateway-system"
dependencies:
  - name: gateway-helm
    # renovate: helm=gateway-helm registry=oci://docker.io/envoyproxy
    version: v1.8.4
    repository: oci://docker.io/envoyproxy
    condition: gateway-helm.enabled
  - name: ai-gateway-crds-helm
    # renovate: helm=ai-gateway-crds-helm registry=oci://docker.io/envoyproxy
    version: "v1.1.0"
    repository: "oci://docker.io/envoyproxy"
    condition: ai-gateway-crds-helm.enabled
  - name: ai-gateway-helm
    # renovate: helm=ai-gateway-helm registry=oci://docker.io/envoyproxy
    version: "v1.1.0"
    repository: "oci://docker.io/envoyproxy"
    condition: ai-gateway-helm.enabled
