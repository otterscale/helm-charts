apiVersion: v2
name: envoy-gateway
description: A Helm chart for envoy-gateway
type: application
version: 1.2.0
# renovate: image=docker.io/envoyproxy/gateway-helm
appVersion: 1.10.0
annotations:
  otterscale.io/type: module
  module.otterscale.io/namespace: envoy-gateway-system
dependencies:
  - name: gateway-helm
    version: 1.10.0
    repository: oci://docker.io/envoyproxy
    condition: gateway-helm.enabled
  - name: ai-gateway-crds-helm
    version: 1.2.1
    repository: oci://docker.io/envoyproxy
    condition: ai-gateway-crds-helm.enabled
  - name: ai-gateway-helm
    version: 1.2.1
    repository: oci://docker.io/envoyproxy
    condition: ai-gateway-helm.enabled
