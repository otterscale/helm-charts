kubevirt:
  # KUBEVIRT_VERSION, and the fallback tag for the images below.
  # renovate: image=quay.io/kubevirt/virt-operator
  version: v1.9.0

  images:
    operator:
      repository: quay.io/kubevirt/virt-operator
      tag: ""
      digest: ""

    # virt-operator derives the component images from its own registry, prefix
    # and version. Set a repository here to pin one to its own tag and digest
    # instead - the chart then passes it as the matching *_IMAGE env var.
    api:
      # quay.io/kubevirt/virt-api
      repository: ""
      tag: ""
      digest: ""

    controller:
      # quay.io/kubevirt/virt-controller
      repository: ""
      tag: ""
      digest: ""

    handler:
      # quay.io/kubevirt/virt-handler
      repository: ""
      tag: ""
      digest: ""

    launcher:
      # quay.io/kubevirt/virt-launcher
      repository: ""
      tag: ""
      digest: ""

    exportProxy:
      # quay.io/kubevirt/virt-exportproxy
      repository: ""
      tag: ""
      digest: ""

    exportServer:
      # quay.io/kubevirt/virt-exportserver
      repository: ""
      tag: ""
      digest: ""

