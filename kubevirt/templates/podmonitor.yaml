apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  namespaceSelector:
    matchNames:
      - kubevirt
  podMetricsEndpoints:
    # Keep the VMI's own namespace label rather than renaming it to
    # exported_namespace: namespace-scoped metrics are enforced on `namespace`.
    # Safe because only pods in the kubevirt namespace are scraped, and
    # tenants cannot create pods there.
    - honorLabels: true
      honorTimestamps: false
      interval: 15s
      path: /metrics
      port: metrics
      scheme: https
      scrapeTimeout: 15s
      tlsConfig:
        insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/component: kubevirt
      prometheus.kubevirt.io: "true"
