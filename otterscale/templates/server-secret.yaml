apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otterscale.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.server.labels" . | nindent 4 }}
type: Opaque
data:
  enrolment-secret: {{ include "otterscale.enrolmentSecret" . | b64enc | quote }}
