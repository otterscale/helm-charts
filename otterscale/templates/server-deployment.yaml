{{- $trustedCA := include "otterscale.trustedCA.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otterscale.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "otterscale.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otterscale.server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/server-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "otterscale.server.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      containers:
        - name: otterscale-server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args: ["server"]
          ports:
            - name: http
              containerPort: 8299
              protocol: TCP
            - name: tunnel
              containerPort: 8300
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "otterscale.server.fullname" . }}-config
          env:
            - name: OTTERSCALE_SERVER_JOIN_SECRET_FILE
              value: /etc/otterscale/join/secret
            {{- if $trustedCA }}
            - name: SSL_CERT_DIR
              value: {{ include "otterscale.trustedCA.dir" . | quote }}
            - name: OTTERSCALE_SERVER_TRUSTED_CA_FILE
              value: {{ include "otterscale.trustedCA.path" . | quote }}
            {{- end }}
            {{- with .Values.server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- if .Values.server.resources }}
            {{- toYaml .Values.server.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1024Mi
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: join
              mountPath: /etc/otterscale/join
              readOnly: true
            {{- if $trustedCA }}
            - name: trusted-ca
              mountPath: {{ include "otterscale.trustedCA.dir" . | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: join
          secret:
            secretName: {{ include "otterscale.server.fullname" . }}
            items:
              - key: join-secret
                path: secret
        {{- if $trustedCA }}
        - name: trusted-ca
          secret:
            secretName: {{ $trustedCA | quote }}
            items:
              - key: {{ .Values.trustedCA.key | quote }}
                path: {{ .Values.trustedCA.key | quote }}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
