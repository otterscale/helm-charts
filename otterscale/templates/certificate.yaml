{{- if eq (include "otterscale.listenerSet.certSource" .) "auto" }}
{{- $caSecret := .Values.expose.listener.tls.auto.caSecretName }}

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "otterscale.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "otterscale.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "otterscale.fullname" . }}-ca
  secretName: {{ $caSecret | quote }}
  duration: 43800h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "otterscale.fullname" . }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "otterscale.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $caSecret | quote }}
---
{{- $default := list (include "otterscale.certHost" .) }}
{{- if .Values.harbor.enabled }}
  {{- $default = append $default (include "otterscale.harbor.host" .) }}
{{- end }}
{{- $names := .Values.expose.listener.tls.auto.subjectAltNames | default (uniq $default) }}
{{- $ips := list }}
{{- $dns := list }}
{{- range $names }}
  {{- $bare := . | trimPrefix "[" | trimSuffix "]" }}
  {{- if or (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}$" $bare) (contains ":" $bare) }}
    {{- $ips = append $ips $bare }}
  {{- else }}
    {{- $dns = append $dns $bare }}
  {{- end }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "otterscale.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  secretName: {{ include "otterscale.listenerSet.tlsSecretName" . | quote }}
  {{- with $dns }}
  dnsNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ips }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "otterscale.fullname" . }}-ca
    kind: Issuer
    group: cert-manager.io
{{- end }}
