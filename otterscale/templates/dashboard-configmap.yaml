apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otterscale.dashboard.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  ORIGIN: {{ include "otterscale.externalURL" . | quote }}
  API_URL: "http://{{ include "otterscale.server.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.server.service.port }}"
  PUBLIC_WEB_URL: {{ include "otterscale.externalURL" . | quote }}
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_REALM_URL: {{ include "otterscale.keycloak.realmURL" . | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloakRealm.clients.dashboard.id | quote }}
  {{- end }}
  {{- if .Values.harbor.enabled }}
  PUBLIC_HARBOR_URL: {{ include "otterscale.harbor.externalURL" . | quote }}
  {{- end }}
  # The import-cluster wizard needs these two for the otterscale-agent install
  # command it generates, and nothing else in this pod carries them. Everything
  # else that command needs the wizard derives from the values above, resolves
  # from the chart repository, or holds as a constant of the agent chart.
  AGENT_TUNNEL_SERVER_URL: {{ include "otterscale.tunnel.externalURL" . | quote }}
  {{- with include "otterscale.trustedCA.secretName" . }}
  AGENT_TRUSTED_CA_SECRET_NAME: {{ . | quote }}
  {{- end }}
