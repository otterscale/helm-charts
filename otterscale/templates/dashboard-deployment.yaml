{{- $trustedCA := include "otterscale.trustedCA.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otterscale.dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "otterscale.dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otterscale.dashboard.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dashboard-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/dashboard-secret.yaml") . | sha256sum }}
        {{- if .Values.harbor.enabled }}
        # HARBOR_ADMIN_PASSWORD is read via secretKeyRef from
        # harbor-admin-secret.yaml, not from dashboard-secret.yaml above, so
        # it needs its own checksum to still trigger a rollout when it changes.
        checksum/harbor-admin-secret: {{ include (print $.Template.BasePath "/harbor-admin-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.dashboard.terminationGracePeriodSeconds }}
      containers:
        - name: otterscale-dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PUBLIC_APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- if $trustedCA }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ include "otterscale.trustedCA.path" . | quote }}
            {{- end }}
            {{- if .Values.harbor.enabled }}
            # Sourced straight from the Secret this chart already generates
            # the admin password into (harbor-admin-secret.yaml), rather than
            # copied through this chart's own dashboard-secret.yaml — so
            # there is exactly one Secret holding this value, not two.
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "otterscale.harbor.adminSecretName" . | quote }}
                  key: {{ include "otterscale.harbor.adminSecretKey" . | quote }}
            {{- end }}
            {{- with .Values.dashboard.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "otterscale.dashboard.fullname" . }}-config
            - secretRef:
                name: {{ include "otterscale.dashboard.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- if .Values.dashboard.resources }}
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1024Mi
            {{- end }}
          {{- if $trustedCA }}
          volumeMounts:
            - name: trusted-ca
              mountPath: {{ include "otterscale.trustedCA.dir" . | quote }}
              readOnly: true
          {{- end }}
      {{- if $trustedCA }}
      volumes:
        - name: trusted-ca
          secret:
            secretName: {{ $trustedCA | quote }}
            items:
              - key: {{ .Values.trustedCA.key | quote }}
                path: {{ .Values.trustedCA.key | quote }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
