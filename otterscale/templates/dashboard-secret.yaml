apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otterscale.dashboard.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
stringData:
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_CLIENT_SECRET: {{ include "otterscale.keycloak.dashboardClientSecret" . | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  REDIS_URL: {{ printf "redis://:%s@%s-valkey.%s.svc.cluster.local:%v" (include "otterscale.valkey.password" .) .Release.Name .Release.Namespace .Values.valkey.service.port | quote }}
  {{- end }}
