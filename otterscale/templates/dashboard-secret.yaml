apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otterscale.dashboard.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
# HARBOR_ADMIN_PASSWORD is deliberately NOT here: dashboard-deployment.yaml
# reads it straight from harbor-admin-secret.yaml via secretKeyRef, so it is
# stored in exactly one Secret rather than duplicated into this one.
#
# The join secret is also NOT here. It stays server-only, and the wizard
# tells the operator to run `otterscale join token` instead, so the token is
# derived by the one process that already holds the root secret.
stringData:
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_CLIENT_SECRET: {{ include "otterscale.keycloak.dashboardClientSecret" . | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  REDIS_URL: {{ printf "redis://:%s@%s-valkey.%s.svc.cluster.local:%v" (include "otterscale.valkey.password" .) .Release.Name .Release.Namespace .Values.valkey.service.port | quote }}
  {{- end }}
