apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "otterscale.listenerSet.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "otterscale.gateway.name" . }}
    namespace: {{ include "otterscale.gateway.namespace" . }}
  listeners:
  - name: {{ include "otterscale.listenerSet.sectionName" . }}
    {{- with include "otterscale.listenerHostname" (include "otterscale.host" .) }}
    hostname: {{ . | quote }}
    {{- end }}
    protocol: HTTPS
    port: {{ include "otterscale.listenerSet.port" . }}
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ include "otterscale.listenerSet.tlsSecretName" . }}
  {{- if .Values.harbor.enabled }}
  - name: {{ include "otterscale.harbor.sectionName" . }}
    {{- with include "otterscale.listenerHostname" (include "otterscale.harbor.host" .) }}
    hostname: {{ . | quote }}
    {{- end }}
    protocol: HTTPS
    port: {{ include "otterscale.harbor.port" . }}
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ include "otterscale.listenerSet.tlsSecretName" . }}
  {{- end }}
