externalURL: "https://otterscale.example.com"

expose:
  listener:
    tls:
      certSource: secret
      secret:
        secretName: "otterscale-tls"

trustedCA:
  secretName: "" # set to the CA Secret when otterscale-tls comes from an internal PKI

harbor:
  externalURL: "https://harbor.example.com"
  caBundleSecretName: "" # same value as trustedCA.secretName

tunnel:
  externalURL: "https://192.0.2.1:30300"
