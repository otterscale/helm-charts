# REQUIRED. https, and a different host from harbor.externalURL.
# Fixed at install time: --import-realm skips a realm that already exists, so
# changing this later leaves the Keycloak clients' redirectUris on the old host
# and every login fails. Changing it means rebuilding the realm.
externalURL: ""

# Needs Gateway API >= v1.5 and Envoy Gateway >= v1.8 (ListenerSet).
expose:
  gateway:
    name: "otterscale-gateway"
    namespace: "envoy-gateway-system"

  # One HTTPS listener, shared by the dashboard and Harbor.
  listener:
    port: "" # empty = 443
    tls:
      # auto   = cert-manager signs it (cert-manager must already be installed)
      # secret = you supply it
      certSource: auto
      auto:
        secretName: "otterscale-tls"
        caSecretName: "otterscale-ca"
        subjectAltNames: [] # empty = the hosts from the two externalURLs
      secret:
        # Keys: "tls.crt", "tls.key"
        secretName: "otterscale-tls"

# The server and the dashboard call Keycloak over externalURL, so a private CA
# has to be trusted inside them or the server will not start.
# Empty is right for a public CA and for certSource "auto"; set it only for a
# Secret this chart did not create.
trustedCA:
  secretName: ""
  key: "ca.crt"

# Root secret for issuing agent join tokens. The registration endpoint is
# unauthenticated, so without it any caller could claim any cluster.
# Empty = generated, reused on upgrade. Changing it invalidates every token
# already handed to an agent.
joinSecret: ""

# Agents dial this directly. Not behind the Gateway: mTLS would not survive a
# terminating listener.
tunnel:
  externalURL: "" # REQUIRED, e.g. https://<node>:<nodePort>
  type: NodePort
  port: 8300
  nodePort: "30300" # NodePort only

server:
  replicas: 1
  image:
    repository: ghcr.io/otterscale/otterscale
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8299

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
  env: []

dashboard:
  replicas: 1
  image:
    repository: ghcr.io/otterscale/dashboard
    tag: v1.4.4
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
  env: []

# Seeded into files/keycloak-realm.json. The subchart reads none of this.
# Seeded ONCE: --import-realm skips a realm that already exists, so nothing here
# reaches a realm that is already there. See externalURL.
# Every password: empty = reuse on upgrade, else generate.
keycloakRealm:
  name: otterscale

  auth:
    adminUser: admin # master realm, not a user in the realm above
    adminPassword: ""

  clients:
    dashboard:
      id: otterscale-dashboard # the server validates tokens against this
      secret: ""
    harbor:
      id: otterscale-harbor
      secret: ""

keycloakPostgres:
  image:
    repository: postgres
    tag: 18-trixie
    pullPolicy: IfNotPresent
  password: ""
  resources: {}

  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 20Gi

# Rendered into a Secret harbor-core reads as CONFIG_OVERWRITE_JSON. Not
# harbor.core.configureUserSettings: Helm cannot template a subchart value, and
# this JSON embeds a generated client secret.
harborOIDC:
  enabled: true
  scope: "openid,profile,email"
  autoOnboard: true
  groupsClaim: "groups"
  adminGroup: "harbor_admin" # members become Harbor admins
  # INTERNAL WIRING: must match harbor.core.extraEnvVars.
  configSecretName: "otterscale-harbor-oidc-config"

valkey:
  enabled: true
  podLabels: {}

  service:
    port: 6379 # SHARED: also builds the dashboard's REDIS_URL

  auth:
    enabled: true # off in the subchart by default
    # INTERNAL WIRING: Secret from templates/valkey-secret.yaml, keyed by ACL
    # username. tpl'd in the SUBCHART's context, so only .Release.Name is safe.
    usersExistingSecret: "{{ .Release.Name }}-valkey-auth"
    aclUsers:
      # Must be listed, or the user is dropped and anyone can connect.
      default:
        permissions: "~* &* +@all"

keycloak:
  enabled: true
  podLabels: {}

  http:
    relativePath: /auth/ # SHARED: also the realm URL and the /auth route

  service:
    httpPort: 80 # SHARED: also the HTTPRoute backendRef port

  # Without it Keycloak crash-loops through its schema migration.
  dbchecker:
    enabled: true

  # SHARED: the subchart's JDBC URL, and this chart's postgres resource names.
  database:
    vendor: postgres
    database: keycloak
    username: keycloak
    existingSecret: otterscale-keycloak-postgres
    existingSecretKey: "postgres-password"
    hostname: otterscale-keycloak-postgres
    port: 5432

  # ── To the end of this block: tpl'd in the SUBCHART's context ──

  # --import-realm only seeds a realm that does not exist yet.
  # --proxy-headers=xforwarded trusts the X-Forwarded-Proto the HTTPRoute sets.
  command:
    - /bin/sh
    - -c
    - |
      /opt/keycloak/bin/kc.sh start \
      --import-realm \
      --http-port=8080 \
      --http-enabled=true \
      --proxy-headers=xforwarded \
      --spi-events-listener-jboss-logging-success-level=info \
      --spi-events-listener-jboss-logging-error-level=warn

  extraEnvFrom: |
    - configMapRef:
        name: {{ include "keycloak.fullname" . }}-env
    - secretRef:
        name: {{ include "keycloak.fullname" . }}-admin

  # cp's destination must match the theme subPath below.
  extraInitContainers: |
    - name: theme-provider
      image: ghcr.io/otterscale/keycloakify:1.2.7
      imagePullPolicy: IfNotPresent
      command: ["cp", "/otterscale-theme.jar", "/otterscale-theme/otterscale-theme.jar"]
      volumeMounts:
        - name: theme-import-volume
          mountPath: /otterscale-theme

  extraVolumeMounts: |
    - name: realm-import-volume
      mountPath: "/opt/keycloak/data/import/otterscale-realm.json"
      subPath: "otterscale-realm.json"
      readOnly: true
    - name: theme-import-volume
      mountPath: "/opt/keycloak/providers/otterscale-theme.jar"
      subPath: "otterscale-theme.jar"
      readOnly: true

  extraVolumes: |
    - name: realm-import-volume
      secret:
        secretName: {{ include "keycloak.fullname" . }}-realm
    - name: theme-import-volume
      emptyDir: {}

harbor:
  enabled: true
  # SHARED: the harbor route's hostname and port, and the OIDC redirect URIs.
  # https, and must differ from externalURL by host or by port — a port here
  # gives Harbor its own listener, which is how one bare IP serves both.
  # Fixed at install time for the same reason as externalURL.
  externalURL: ""
  # Empty = generated into the Secret below and reused on upgrade. Harbor
  # applies it only when it first creates the admin user.
  harborAdminPassword: ""
  # INTERNAL WIRING: this chart generates that Secret under this name. Kept on
  # uninstall, like Harbor's PVCs.
  existingSecretAdminPassword: "otterscale-harbor-admin"

  # INTERNAL WIRING: the same CA as trustedCA, injected into core, jobservice,
  # registry and trivy. Aligned by hand; empty under a private CA is refused.
  caBundleSecretName: "otterscale-ca"

  # Image tags stay unpinned: the subchart's defaults track its appVersion.

  core:
    # INTERNAL WIRING: name must match harborOIDC.configSecretName. optional,
    # because that Secret is absent unless Keycloak and OIDC are both on.
    extraEnvVars:
      - name: CONFIG_OVERWRITE_JSON
        valueFrom:
          secretKeyRef:
            name: "otterscale-harbor-oidc-config"
            key: CONFIG_OVERWRITE_JSON
            optional: true

  # Reached through the Gateway, which already terminated TLS.
  expose:
    type: clusterIP
    tls:
      enabled: false
