name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
      # A Python of its own: the runner's system one is externally managed
      # (PEP 668) and refuses pip install.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install pyyaml
      # make test fetches prometheus-stack's subchart, which is not committed.
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: make test
