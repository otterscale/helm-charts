{{- range $name, $repo := .Values.repositories }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "otterscale-agent-flux.labels" $ | nindent 4 }}
    {{- with $repo.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if hasPrefix "oci://" $repo.url }}
  type: oci
  {{- end }}
  url: {{ $repo.url | quote }}
  interval: {{ $repo.interval }}
  {{- with $repo.secretRef }}
  secretRef:
    name: {{ . }}
  {{- end }}
{{- end }}
