hami:
  enabled: true

  scheduler:
    certManager:
      enabled: true

    patch:
      enabled: false

  devicePlugin:
    enabled: true

    gpuOperatorToolkitReady:
      enabled: true
      hostPath: /run/nvidia/validations

    deviceListStrategy: cdi-annotations
    nvidiaHookPath: /usr/local/nvidia/toolkit/nvidia-ctk
    nvidiaDriverRoot: /run/nvidia/driver

    service:
      type: ClusterIP

    securityContext:
      seLinuxOptions:
        type: spc_t

    nvidiaNodeSelector:
      gpu: null
      otterscale.io/gpu: "true"

  devices:
    metax:
      enabled: false

    hygon:
      enabled: false

    cambricon:
      enabled: false

    amd:
      enabled: false

    awsneuron:
      enabled: false

    kunlun:
      enabled: false

    enflame:
      enabled: false

    mthreads:
      enabled: false

    vastai:
      enabled: false

    biren:
      enabled: false

    nvidia:
      runtimeClassName: nvidia

    remotegpu:
      enabled: false

    ascend:
      enabled: false

    iluvatar:
      enabled: false

  prometheus:
    enabled: true
