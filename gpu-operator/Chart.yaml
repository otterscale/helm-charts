apiVersion: v2
name: gpu-operator
description: A Helm chart for gpu-operator
type: application
version: 1.0.0
# renovate: helm=gpu-operator registry=https://nvidia.github.io/gpu-operator
appVersion: "v26.3.3"
annotations:
  otterscale.io/type: module
  module.otterscale.io/depends-on: "prometheus-stack,node-feature-discovery"
  module.otterscale.io/namespace: "gpu-operator"
dependencies:
  - name: gpu-operator
    version: v26.3.3
    repository: https://nvidia.github.io/gpu-operator
    condition: gpu-operator.enabled
