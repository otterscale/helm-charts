kube-prometheus-stack:
  enabled: true

  # kube-rbac-proxy (OTTERSCALE-288): Prometheus and Alertmanager listen on
  # 127.0.0.1 only and each gets a kube-rbac-proxy sidecar; node-exporter turns
  # on its subchart's. That makes three kube-rbac-proxy guards; kube-state-metrics
  # uses its own auth filter instead. Every guard serves TLS from one
  # cert-manager CA (templates/kube-rbac-proxy-tls.yaml) and authorizes each
  # request with a SubjectAccessReview. Prometheus scrapes and alerts through
  # them with its own ServiceAccount token, verifying the certificates.
  # Anything that read Prometheus on :9090 directly (a self-hosted Grafana,
  # for one) now needs a token and the CA, on :9091.
  #
  # extraArgs, volumes, volumeMounts and containers below are lists: a values
  # file that sets any of them replaces the whole list and drops the guard or
  # TLS wiring. An override must restate the full list (phison-ai/release
  # SXMR0105/0003 does this for the two sidecars).

  grafana:
    enabled: false

  prometheusOperator:
    admissionWebhooks:
      failurePolicy: IgnoreOnInstallOnly
      patch:
        enabled: false
      certManager:
        enabled: true

  alertmanager:
    service:
      port: 9095
      targetPort: 9095
    serviceMonitor:
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        ca:
          secret:
            name: prometheus-stack-kube-prom-alertmanager-tls
            key: ca.crt
        serverName: prometheus-stack-kube-prom-alertmanager.monitoring.svc
      # config-reloader is localhost-only under listenLocal; its metrics are given up.
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_endpoint_port_name]
          regex: reloader-web
    alertmanagerSpec:
      # Used as is (no route prefix); the default would render http://...:9095.
      externalUrl: https://prometheus-stack-kube-prom-alertmanager.monitoring.svc:9095
      # The operator sets no probes on a listenLocal Alertmanager; the
      # sidecar's readiness stands in.
      listenLocal: true
      containers:
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.22.1
          args:
            - --secure-listen-address=:9095
            - --upstream=http://127.0.0.1:9093/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --proxy-endpoints-port=9443
          ports:
            # The name the Service and alertmanager-operated target.
            - name: http-web
              containerPort: 9095
            - name: krp-healthz
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: kube-rbac-proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: kube-rbac-proxy-config
          configMap:
            name: prometheus-stack-kube-prom-alertmanager-kube-rbac-proxy
        - name: kube-rbac-proxy-tls
          secret:
            secretName: prometheus-stack-kube-prom-alertmanager-tls

  kube-state-metrics:
    # Not kubeRBACProxy: the subchart (8.4.2, and 8.6.0 too) hardcodes probes on
    # the named ports http and metrics, but in that mode the main container
    # declares no ports (the sidecars do), and kubelet resolves a named probe
    # port only against the probed container, so the pod never gets Ready.
    # KSM's own --auth-filter does TokenReview plus a SubjectAccessReview on
    # nonResourceURL /metrics (get), which Prometheus's ClusterRole already
    # grants and tenants do not; /livez and /readyz stay open. --tls-config
    # serves it over TLS from the cert-manager CA (templates/
    # kube-state-metrics-web-config.yaml); the files are re-read on renewal.
    authFilter:
      enabled: true
    extraArgs:
      - --tls-config=/etc/kube-state-metrics/web-config.yaml
    volumes:
      - name: kube-rbac-proxy-tls
        secret:
          secretName: prometheus-stack-kube-state-metrics-tls
      - name: web-config
        configMap:
          name: prometheus-stack-kube-state-metrics-web-config
    volumeMounts:
      - name: kube-rbac-proxy-tls
        mountPath: /etc/tls/private
        readOnly: true
      - name: web-config
        mountPath: /etc/kube-state-metrics
        readOnly: true
    livenessProbe:
      httpGet:
        scheme: https
    readinessProbe:
      httpGet:
        scheme: https
    prometheus:
      monitor:
        scheme: https
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        tlsConfig:
          ca:
            secret:
              name: prometheus-stack-kube-state-metrics-tls
              key: ca.crt
          serverName: prometheus-stack-kube-state-metrics.monitoring.svc

  prometheus-node-exporter:
    # The guard takes :9100 on every node; node-exporter moves to
    # 127.0.0.1:8100 and the guard's /healthz to :8888 (host network).
    kubeRBACProxy:
      enabled: true
      image:
        registry: quay.io
        repository: brancz/kube-rbac-proxy
        tag: v0.22.1
      tls:
        enabled: true
    tlsSecret:
      enabled: true
      secretName: prometheus-stack-prometheus-node-exporter-tls
    prometheus:
      monitor:
        scheme: https
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        tlsConfig:
          ca:
            secret:
              name: prometheus-stack-prometheus-node-exporter-tls
              key: ca.crt
          # Scraped by node IP, so name the certificate explicitly.
          serverName: prometheus-stack-prometheus-node-exporter.monitoring.svc

  prometheus:
    # The Service fronts the guard: 9091 is kube-rbac-proxy. reloader-web goes
    # too; config-reloader follows listenLocal onto 127.0.0.1, so its metrics
    # and the ConfigReloaderSidecarErrors alert are lost (accepted in the spec).
    service:
      port: 9091
      targetPort: 9091
      reloaderWebPort: 0
    serviceMonitor:
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        ca:
          secret:
            name: prometheus-stack-kube-prom-prometheus-tls
            key: ca.crt
        serverName: prometheus-stack-kube-prom-prometheus.monitoring.svc
      # config-reloader is localhost-only under listenLocal; its metrics are given up.
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_endpoint_port_name]
          regex: reloader-web
    # Prometheus scrapes itself and Alertmanager, and sends alerts, through
    # their guards.
    additionalRulesForClusterRole:
      - apiGroups: ["monitoring.coreos.com"]
        resources: ["prometheuses/api", "alertmanagers/api"]
        resourceNames: ["prometheus-stack-kube-prom-prometheus", "prometheus-stack-kube-prom-alertmanager"]
        verbs: ["get", "create"]
    prometheusSpec:
      # Used as is (no route prefix); the default would render http://...:9091.
      externalUrl: https://prometheus-stack-kube-prom-prometheus.monitoring.svc:9091
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: "30d"
      retentionSize: "35GiB"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "50Gi"
      # With listenLocal the operator turns Prometheus's probes into wget inside
      # the container, which the busybox-based images support.
      listenLocal: true
      alertingEndpoints:
        - namespace: monitoring
          name: prometheus-stack-kube-prom-alertmanager
          port: http-web
          scheme: https
          apiVersion: v2
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            ca:
              secret:
                name: prometheus-stack-kube-prom-alertmanager-tls
                key: ca.crt
            serverName: prometheus-stack-kube-prom-alertmanager.monitoring.svc
      containers:
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.22.1
          args:
            - --secure-listen-address=:9091
            - --upstream=http://127.0.0.1:9090/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --proxy-endpoints-port=9443
          ports:
            # The name the Service, prometheus-operated and the
            # self-monitoring ServiceMonitor target.
            - name: http-web
              containerPort: 9091
            - name: krp-healthz
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: kube-rbac-proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: kube-rbac-proxy-config
          configMap:
            name: prometheus-stack-kube-prom-prometheus-kube-rbac-proxy
        - name: kube-rbac-proxy-tls
          secret:
            secretName: prometheus-stack-kube-prom-prometheus-tls
