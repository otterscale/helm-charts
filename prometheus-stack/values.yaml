kube-prometheus-stack:
  enabled: true

  # Prometheus and Alertmanager listen on 127.0.0.1 behind a kube-rbac-proxy sidecar;
  # node-exporter uses its subchart's, kube-state-metrics its own auth filter.
  # All serve TLS from one cert-manager CA. Readers of :9090 now need a token, the CA and :9091.
  # extraArgs, volumes, volumeMounts and containers are lists: overriding one
  # replaces it whole, so restate the guard entries.

  grafana:
    enabled: false

  prometheusOperator:
    admissionWebhooks:
      failurePolicy: IgnoreOnInstallOnly
      patch:
        enabled: false
      certManager:
        enabled: true

  alertmanager:
    service:
      port: 9095
      targetPort: 9095
    serviceMonitor:
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        ca:
          secret:
            name: prometheus-stack-kube-prom-alertmanager-tls
            key: ca.crt
        serverName: prometheus-stack-kube-prom-alertmanager.monitoring.svc
      # config-reloader is localhost-only under listenLocal; its metrics are given up.
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_endpoint_port_name]
          regex: reloader-web
    alertmanagerSpec:
      # Used as is (no route prefix); the default would render http://...:9095.
      externalUrl: https://prometheus-stack-kube-prom-alertmanager.monitoring.svc:9095
      # No operator probes under listenLocal; the sidecar's readiness stands in.
      listenLocal: true
      containers:
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.23.1
          args:
            - --secure-listen-address=:9095
            - --upstream=http://127.0.0.1:9093/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --proxy-endpoints-port=9443
          ports:
            # The name the Service and alertmanager-operated target.
            - name: http-web
              containerPort: 9095
            - name: krp-healthz
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: kube-rbac-proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: kube-rbac-proxy-config
          configMap:
            name: prometheus-stack-kube-prom-alertmanager-kube-rbac-proxy
        - name: kube-rbac-proxy-tls
          secret:
            secretName: prometheus-stack-kube-prom-alertmanager-tls

  kube-state-metrics:
    # Not kubeRBACProxy: in that mode the subchart's probes use named ports the main
    # container no longer declares, so the pod never gets Ready. --auth-filter checks
    # get on nonResourceURL /metrics instead (Prometheus has it, tenants don't);
    # /livez and /readyz stay open.
    authFilter:
      enabled: true
    extraArgs:
      - --tls-config=/etc/kube-state-metrics/web-config.yaml
    volumes:
      - name: kube-rbac-proxy-tls
        secret:
          secretName: prometheus-stack-kube-state-metrics-tls
      - name: web-config
        configMap:
          name: prometheus-stack-kube-state-metrics-web-config
    volumeMounts:
      - name: kube-rbac-proxy-tls
        mountPath: /etc/tls/private
        readOnly: true
      - name: web-config
        mountPath: /etc/kube-state-metrics
        readOnly: true
    livenessProbe:
      httpGet:
        scheme: https
    readinessProbe:
      httpGet:
        scheme: https
    prometheus:
      monitor:
        scheme: https
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        tlsConfig:
          ca:
            secret:
              name: prometheus-stack-kube-state-metrics-tls
              key: ca.crt
          serverName: prometheus-stack-kube-state-metrics.monitoring.svc

  prometheus-node-exporter:
    # The guard takes :9100 on every node; node-exporter moves to
    # 127.0.0.1:8100 and the guard's /healthz to :8888 (host network).
    kubeRBACProxy:
      enabled: true
      image:
        registry: quay.io
        repository: brancz/kube-rbac-proxy
        tag: v0.23.1
      tls:
        enabled: true
    tlsSecret:
      enabled: true
      secretName: prometheus-stack-prometheus-node-exporter-tls
    prometheus:
      monitor:
        scheme: https
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        tlsConfig:
          ca:
            secret:
              name: prometheus-stack-prometheus-node-exporter-tls
              key: ca.crt
          # Scraped by node IP, so name the certificate explicitly.
          serverName: prometheus-stack-prometheus-node-exporter.monitoring.svc

  prometheus:
    # 9091 is the guard. config-reloader moves to 127.0.0.1, so its metrics and
    # the ConfigReloaderSidecarErrors alert are lost.
    service:
      port: 9091
      targetPort: 9091
      reloaderWebPort: 0
    serviceMonitor:
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        ca:
          secret:
            name: prometheus-stack-kube-prom-prometheus-tls
            key: ca.crt
        serverName: prometheus-stack-kube-prom-prometheus.monitoring.svc
      # config-reloader is localhost-only under listenLocal; its metrics are given up.
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_endpoint_port_name]
          regex: reloader-web
    # GET is get, POST is create. No create on itself, so its token cannot
    # POST /-/reload or /-/quit.
    additionalRulesForClusterRole:
      - apiGroups: ["monitoring.coreos.com"]
        resources: ["prometheuses/api"]
        resourceNames: ["prometheus-stack-kube-prom-prometheus"]
        verbs: ["get"]
      - apiGroups: ["monitoring.coreos.com"]
        resources: ["alertmanagers/api"]
        resourceNames: ["prometheus-stack-kube-prom-alertmanager"]
        verbs: ["get", "create"]
    prometheusSpec:
      # Used as is (no route prefix); the default would render http://...:9091.
      externalUrl: https://prometheus-stack-kube-prom-prometheus.monitoring.svc:9091
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: "30d"
      retentionSize: "35GiB"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "50Gi"
      # listenLocal probes run sh in the container and -distroless has none; keep an
      # image with a shell (renovate.json excludes -distroless).
      image:
        registry: quay.io
        repository: prometheus/prometheus
        tag: v3.16.0
      listenLocal: true
      alertingEndpoints:
        - namespace: monitoring
          name: prometheus-stack-kube-prom-alertmanager
          port: http-web
          scheme: https
          apiVersion: v2
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            ca:
              secret:
                name: prometheus-stack-kube-prom-alertmanager-tls
                key: ca.crt
            serverName: prometheus-stack-kube-prom-alertmanager.monitoring.svc
      containers:
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.23.1
          args:
            - --secure-listen-address=:9091
            - --upstream=http://127.0.0.1:9090/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --proxy-endpoints-port=9443
          ports:
            # The name the Service, prometheus-operated and the self-ServiceMonitor target.
            - name: http-web
              containerPort: 9091
            - name: krp-healthz
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: krp-healthz
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: kube-rbac-proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: kube-rbac-proxy-config
          configMap:
            name: prometheus-stack-kube-prom-prometheus-kube-rbac-proxy
        - name: kube-rbac-proxy-tls
          secret:
            secretName: prometheus-stack-kube-prom-prometheus-tls
