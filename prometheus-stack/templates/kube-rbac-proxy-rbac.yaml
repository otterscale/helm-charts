{{- /*
The Prometheus and Alertmanager guards run as their pod's ServiceAccount and
need TokenReview and SubjectAccessReview for every request. The exporters'
subcharts grant theirs.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-stack-kube-rbac-proxy-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prometheus-stack-kube-prom-prometheus
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: prometheus-stack-kube-prom-alertmanager
    namespace: {{ .Release.Namespace }}
