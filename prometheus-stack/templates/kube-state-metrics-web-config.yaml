{{- /*
kube-state-metrics serves TLS itself (its --tls-config takes this exporter-toolkit
web config) from the same cert-manager CA as the kube-rbac-proxy guards.
exporter-toolkit re-reads the files, so renewals are picked up.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-stack-kube-state-metrics-web-config
  namespace: {{ .Release.Namespace }}
data:
  web-config.yaml: |
    tls_server_config:
      cert_file: /etc/tls/private/tls.crt
      key_file: /etc/tls/private/tls.key
