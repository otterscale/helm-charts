{{- if index .Values "kube-prometheus-stack" "enabled" }}
{{- /* TLS config for kube-state-metrics' --tls-config, from the same CA as the guards. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-stack-kube-state-metrics-web-config
  namespace: {{ .Release.Namespace }}
data:
  web-config.yaml: |
    tls_server_config:
      cert_file: /etc/tls/private/tls.crt
      key_file: /etc/tls/private/tls.key
{{- end }}
